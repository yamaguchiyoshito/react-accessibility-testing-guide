<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="412" viewBox="0 0 1000 412" role="img" aria-label="4層の標準化" aria-describedby="desc">
<desc id="desc">上から「人・支援技術（観点：業務の遂行可能性）：情報を理解し、実際に業務を遂行できる」「Playwright（観点：操作可能性）：期待する操作・状態遷移が成立する」「axe-core（観点：情報の認識可能性）：描画されたUIに機械検出可能な違反がない」「静的解析（観点：実装の妥当性）：実装ルールに違反していない」の4層を積み、右端の下から上への矢印に「何度でも実行」から「機会は限られる」へと記した図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">アクセシビリティテストは、自動化できる3層と人の1層で標準化する</text>
<rect x="60" y="92" width="390" height="56" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="255" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#6a4ea6">人・支援技術</text><text x="255" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">観点：業務の遂行可能性</text><rect x="470" y="92" width="330" height="56" rx="12" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="635" y="127" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">情報を理解し、実際に業務を遂行できる</text><rect x="60" y="156" width="390" height="56" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="255" y="180" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b5f9e">Playwright</text><text x="255" y="204" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">観点：操作可能性</text><rect x="470" y="156" width="330" height="56" rx="12" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="635" y="191" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">期待する操作・状態遷移が成立する</text><rect x="60" y="220" width="390" height="56" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="255" y="244" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b5f9e">axe-core</text><text x="255" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">観点：情報の認識可能性</text><rect x="470" y="220" width="330" height="56" rx="12" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="635" y="255" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">描画されたUIに機械検出可能な違反がない</text><rect x="60" y="284" width="390" height="56" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="255" y="308" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b5f9e">静的解析</text><text x="255" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">観点：実装の妥当性</text><rect x="470" y="284" width="330" height="56" rx="12" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="635" y="319" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">実装ルールに違反していない</text>
<text x="255" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#55646d">層</text>
<text x="635" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#55646d">保証する品質</text>
<path d="M880.0 332.0 L880.0 122.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="880.0,112.0 887.0,124.0 873.0,124.0" fill="#607a91"/><text x="880" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#6a4ea6">機会は限られる</text><text x="880" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2b5f9e">何度でも実行</text>
<text x="500" y="384" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">4層は§1の4つの観点に対応する。下の3層は開発中に繰り返し実行し、最上層は人がリリース前に確認する</text>
</svg>

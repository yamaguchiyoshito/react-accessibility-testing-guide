<path d="M729.0 314 V302 H940.0 V314" stroke="#6a4ea6" stroke-width="2" fill="none"/><text x="834" y="335" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#6a4ea6">人・支援技術</text>
<text x="500" y="378" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">既存システムでは、既知の違反を管理し、新規違反を増やさない回帰防止方式から始める</text>
</svg>

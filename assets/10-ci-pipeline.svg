<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="406" viewBox="0 0 1000 406" role="img" aria-label="実行タイミングと品質ゲート" aria-describedby="desc">
<desc id="desc">コミット時、PR／MR時、ビルド後、リリース前の4つのタイミングを左から右へ1本の矢印でつなぎ、それぞれ「ESLint（jsx-a11y）：静的な実装ルール違反、ゲートはLintエラー0件」「Vitest・Storybook：axe-core、コンポーネントの状態・操作、ゲートは自動検査違反0件」「Playwright：axe-core・MSW、画面構造・キー操作・遷移、ゲートは違反0件・成功」「NVDA・VoiceOver：手動評価、主要業務を支援技術で検証、ゲートは適合評価完了」のカードを置き、左3列を「自動テスト：毎回実行できる」、右1列を「人・支援技術」のブラケットで括った図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">自動テストはコミットからビルド後まで段階的に走り、リリース前は人が確認する</text>
<path d="M165.5 115.0 L952.0 115.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="962.0,115.0 950.0,122.0 950.0,108.0" fill="#607a91"/><rect x="60" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="166" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">コミット時</text><rect x="283" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="388" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">PR／MR時</text><rect x="506" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="612" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">ビルド後</text><rect x="729" y="96" width="211" height="38" rx="19.0" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="834" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#6a4ea6">リリース前</text>
<rect x="60" y="160" width="211" height="120" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="166" y="188" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">ESLint（jsx-a11y）</text><text x="166" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">静的な実装ルール違反</text><text x="166" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">ゲート：Lintエラー0件</text>
<rect x="283" y="160" width="211" height="120" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="388" y="188" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">Vitest・Storybook</text><text x="388" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">axe-core</text><text x="388" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">コンポーネントの状態・操作</text><text x="388" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">ゲート：自動検査違反0件</text>
<rect x="506" y="160" width="211" height="120" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="612" y="188" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">Playwright</text><text x="612" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">axe-core・MSW</text><text x="612" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">画面構造・キー操作・遷移</text><text x="612" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">ゲート：違反0件・成功</text>
<rect x="729" y="160" width="211" height="120" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="834" y="188" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#6a4ea6">NVDA・VoiceOver</text><text x="834" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">手動評価</text><text x="834" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">主要業務を支援技術で検証</text><text x="834" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">ゲート：適合評価完了</text>

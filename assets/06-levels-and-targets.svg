<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="438" viewBox="0 0 1000 438" role="img" aria-label="工程ごとの主な確認対象" aria-describedby="desc">
<desc id="desc">FE単体、FE内部結合、FE・BE結合、ST（システムテスト）の4段階の下に、それぞれ「コンポーネント（HTML・ARIA属性、名称・役割、操作、コントラスト）」「画面（画面全体の構造、フォーカス順序、画面遷移後のフォーカス、拡大・リフロー、APIエラー時の通知）」「実APIとの結合（認証画面の操作）」「業務シナリオ（スクリーンリーダー操作、業務シナリオの完遂）」のカードを置き、左2列をブラケットで括って「主戦場：PG・UT工程」とした図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">アクセシビリティの確認対象の大半は、PG・UT工程に主戦場がある</text>
<path d="M165.5 115.0 L952.0 115.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="962.0,115.0 950.0,122.0 950.0,108.0" fill="#607a91"/><rect x="60" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="166" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">FE単体</text><rect x="283" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="388" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">FE内部結合</text><rect x="506" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="612" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">FE・BE結合</text><rect x="729" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="834" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">ST（システムテスト）</text>
<rect x="60" y="160" width="211" height="150" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="166" y="188" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">コンポーネント</text><text x="166" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">HTML・ARIA属性</text><text x="166" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">名称・役割</text><text x="166" y="256" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">操作</text><text x="166" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">コントラスト</text>
<rect x="283" y="160" width="211" height="150" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="388" y="188" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">画面</text><text x="388" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">画面全体の構造</text><text x="388" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">フォーカス順序</text><text x="388" y="256" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">画面遷移後のフォーカス</text><text x="388" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">拡大・リフロー</text><text x="388" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">APIエラー時の通知</text>
<rect x="506" y="160" width="211" height="150" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="612" y="188" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">実APIとの結合</text><text x="612" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">認証画面の操作</text>
<rect x="729" y="160" width="211" height="150" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="834" y="188" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#6a4ea6">業務シナリオ</text><text x="834" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">スクリーンリーダー操作</text><text x="834" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">業務シナリオの完遂</text>
<path d="M60.0 344 V332 H494.0 V344" stroke="#2f6b45" stroke-width="2" fill="none"/><text x="277" y="365" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2f6b45">主戦場：PG・UT工程</text>
<text x="500" y="410" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">Backendの完成を待たずに検証できる不具合が大半を占める</text>
</svg>

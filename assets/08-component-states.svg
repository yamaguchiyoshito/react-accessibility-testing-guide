<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="378" viewBox="0 0 1000 378" role="img" aria-label="入力コンポーネントの状態ごとの検査" aria-describedby="desc">
<desc id="desc">入力コンポーネントの4つの状態「Default（user@example.com）」「Required（必須の印付きで未入力）」「Error（abc、形式が正しくありません）」「Disabled（非活性）」を小さな枠で並べ、それぞれから下の「axe-coreによる各Storyの検査（ラベルの関連付け・ARIA属性・コントラスト）」へ矢印を引いた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">状態ごとにStoryを定義し、各状態をaxe-coreで検査する</text>
<rect x="60" y="96" width="190" height="124" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="155" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">Default</text>
<text x="75" y="144" text-anchor="start" font-family="sans-serif" font-size="14" fill="#223e53">メールアドレス</text>
<rect x="75" y="152" width="160" height="30" rx="6" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/>
<text x="83" y="172" text-anchor="start" font-family="sans-serif" font-size="14" fill="#223e53">user@example.com</text>
<path d="M155.0 220.0 L155.0 244.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="155.0,254.0 148.0,242.0 162.0,242.0" fill="#607a91"/>
<rect x="290" y="96" width="190" height="124" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="385" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">Required</text>
<text x="305" y="144" text-anchor="start" font-family="sans-serif" font-size="14" fill="#223e53">メールアドレス *</text>
<rect x="305" y="152" width="160" height="30" rx="6" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/>
<text x="313" y="172" text-anchor="start" font-family="sans-serif" font-size="14" fill="#55646d">未入力</text>
<path d="M385.0 220.0 L385.0 244.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="385.0,254.0 378.0,242.0 392.0,242.0" fill="#607a91"/>
<rect x="520" y="96" width="190" height="124" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="615" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">Error</text>
<text x="535" y="144" text-anchor="start" font-family="sans-serif" font-size="14" fill="#223e53">メールアドレス</text>
<rect x="535" y="152" width="160" height="30" rx="6" fill="#fcfdfd" stroke="#c0604a" stroke-width="1"/>
<text x="543" y="172" text-anchor="start" font-family="sans-serif" font-size="14" fill="#223e53">abc</text>
<text x="535" y="204" text-anchor="start" font-family="sans-serif" font-size="14" fill="#9c3f2a">形式が正しくありません</text>
<path d="M615.0 220.0 L615.0 244.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="615.0,254.0 608.0,242.0 622.0,242.0" fill="#607a91"/>
<rect x="750" y="96" width="190" height="124" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="845" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">Disabled</text>
<text x="765" y="144" text-anchor="start" font-family="sans-serif" font-size="14" fill="#223e53">メールアドレス</text>
<rect x="765" y="152" width="160" height="30" rx="6" fill="#d6e6f2" stroke="#8ea6b2" stroke-width="1"/>
<text x="773" y="172" text-anchor="start" font-family="sans-serif" font-size="14" fill="#55646d">user@example.com</text>
<path d="M845.0 220.0 L845.0 244.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="845.0,254.0 838.0,242.0 852.0,242.0" fill="#607a91"/>
<rect x="60" y="254" width="880" height="56" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="500" y="278" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">axe-coreによる各Storyの検査</text><text x="500" y="302" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">ラベルの関連付け・ARIA属性・コントラスト</text>
<text x="500" y="350" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">Loading・モーダル表示なども、状態として定義しなければ検査されない</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="372" viewBox="0 0 1000 372" role="img" aria-label="検証の単位とテストレベル" aria-describedby="desc">
<desc id="desc">FE単体、FE内部結合、FE・BE結合、ST（システムテスト）の4段階を左から右へ1本の矢印でつなぎ、FE単体の列に「コンポーネント単位（Role・名称・操作・配色）」、FE内部結合の列に「画面単位（構造・フォーカス・通知）」、FE・BE結合の列に「実APIに依存する操作だけ」、STの列に「業務シナリオ単位（支援技術で業務を完遂）」を置き、左2列をブラケットで括って「PG・UT工程（Backendの完成を待たない）」とした図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">確認の単位ごとに主たる工程を決め、すべてをSTに回さない</text>
<path d="M165.5 115.0 L952.0 115.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="962.0,115.0 950.0,122.0 950.0,108.0" fill="#607a91"/><rect x="60" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="166" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">FE単体</text><rect x="283" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="388" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">FE内部結合</text><rect x="506" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="612" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">FE・BE結合</text><rect x="729" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="834" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">ST（システムテスト）</text>
<rect x="60" y="170" width="211" height="70" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="166" y="201" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">コンポーネント単位</text><text x="166" y="225" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Role・名称・操作・配色</text>
<rect x="283" y="170" width="211" height="70" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="388" y="201" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">画面単位</text><text x="388" y="225" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">構造・フォーカス・通知</text>
<text x="612" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#55646d">実APIに依存する</text><text x="612" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#55646d">操作だけ</text>
<rect x="729" y="170" width="211" height="70" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="834" y="201" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#6a4ea6">業務シナリオ単位</text><text x="834" y="225" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">支援技術で業務を完遂</text>
<path d="M60.0 274 V262 H494.0 V274" stroke="#2f6b45" stroke-width="2" fill="none"/><text x="277" y="295" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2f6b45">PG・UT工程（Backendの完成を待たない）</text>
<text x="500" y="344" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">Backendが要るのは、実APIに依存する操作と、業務シナリオの完遂だけ</text>
</svg>

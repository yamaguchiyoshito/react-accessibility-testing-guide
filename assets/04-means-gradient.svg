<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img" aria-label="手段と自動化の度合い" aria-describedby="desc">
<desc id="desc">4枚のカードを左から「◎ 自動化に適する（静的コード解析、DOM解析、コンポーネントテスト、ブラウザ操作テスト）」「○ 部分的に自動化（視覚的検証：拡大表示・配色・リフロー）」「△ 原則手動（支援技術による検証：スクリーンリーダー、音声操作）」「― 人による評価（ユーザビリティ評価：理解・操作・業務遂行）」と並べ、下の左から右への矢印に「確認の対象が、実際の利用に近づく」と記し、対象を「ソース・DOM・ブラウザ」「見た目」「支援技術」「利用者」と添えた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">左の手段ほど機械で確認でき、右に進むほど人の判断が要る</text>
<rect x="60" y="96" width="210" height="150" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="165" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">◎ 自動化に適する</text><text x="165" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">静的コード解析</text><text x="165" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">DOM解析</text><text x="165" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">コンポーネントテスト</text><text x="165" y="218" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">ブラウザ操作テスト</text>
<rect x="290" y="96" width="210" height="150" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="395" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">○ 部分的に自動化</text><text x="395" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">視覚的検証</text><text x="395" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">拡大表示・配色・リフロー</text>
<rect x="520" y="96" width="210" height="150" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="625" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#6a4ea6">△ 原則手動</text><text x="625" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">支援技術による検証</text><text x="625" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">スクリーンリーダー</text><text x="625" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">音声操作</text>
<rect x="750" y="96" width="210" height="150" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="855" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#6a4ea6">― 人による評価</text><text x="855" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">ユーザビリティ評価</text><text x="855" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">理解・操作・業務遂行</text>
<text x="500" y="282" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#36556d">確認の対象が、実際の利用に近づく</text>
<path d="M60.0 296.0 L950.0 296.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="960.0,296.0 948.0,303.0 948.0,289.0" fill="#607a91"/>
<text x="165" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">ソース・DOM・ブラウザ</text>
<text x="395" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">見た目</text>
<text x="625" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">支援技術</text>
<text x="855" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">利用者</text>
<text x="500" y="364" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">ツールだけでは適合を判断できず、人による評価が必要（W3C）</text>
</svg>

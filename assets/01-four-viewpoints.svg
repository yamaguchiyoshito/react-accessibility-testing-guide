<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="412" viewBox="0 0 1000 412" role="img" aria-label="4つの観点と主な手段" aria-describedby="desc">
<desc id="desc">上から「業務の遂行可能性（支援技術を使った業務フローの完遂）：シナリオテスト・利用者評価」「操作可能性（キーボード・フォーカス・入力操作）：ブラウザテスト・手動操作」「情報の認識可能性（コントラスト・拡大表示・読み上げ）：自動テスト・目視確認」「実装の妥当性（HTML・ARIA・アクセシブルネーム）：静的解析・自動テスト」の4層を積み、右端の下から上への矢印に「機械で確認」から「人の判断」へと記した図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">4つの観点は積み上がり、上の観点ほど人の判断が要る</text>
<rect x="60" y="92" width="390" height="56" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="255" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#6a4ea6">業務の遂行可能性</text><text x="255" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">支援技術を使った業務フローの完遂</text><rect x="470" y="92" width="330" height="56" rx="12" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="635" y="127" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">シナリオテスト・利用者評価</text><rect x="60" y="156" width="390" height="56" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="255" y="180" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">操作可能性</text><text x="255" y="204" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">キーボード・フォーカス・入力操作</text><rect x="470" y="156" width="330" height="56" rx="12" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="635" y="191" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">ブラウザテスト・手動操作</text><rect x="60" y="220" width="390" height="56" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="255" y="244" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">情報の認識可能性</text><text x="255" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">コントラスト・拡大表示・読み上げ</text><rect x="470" y="220" width="330" height="56" rx="12" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="635" y="255" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">自動テスト・目視確認</text><rect x="60" y="284" width="390" height="56" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="255" y="308" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b5f9e">実装の妥当性</text><text x="255" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">HTML・ARIA・アクセシブルネーム</text><rect x="470" y="284" width="330" height="56" rx="12" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="635" y="319" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">静的解析・自動テスト</text>
<text x="255" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#55646d">観点</text>
<text x="635" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#55646d">主な手段</text>
<path d="M880.0 332.0 L880.0 122.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="880.0,112.0 887.0,124.0 873.0,124.0" fill="#607a91"/><text x="880" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#6a4ea6">人の判断</text><text x="880" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2b5f9e">機械で確認</text>
<text x="500" y="384" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">実装が妥当でなければ情報は伝わらず、情報が伝わらなければ操作も業務も成立しない</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" role="img" aria-label="3層で保証する品質" aria-describedby="desc">
<desc id="desc">上から「システム：業務フロー。保証：支援技術を使用して業務を完遂できること」「個別画面：顧客検索・顧客登録・契約一覧・契約詳細。保証：文脈に応じたラベル・配置・画面遷移・エラー通知」「デザインシステム（検証済みを再利用）：Button・Input・Dialog・Select・Checkbox・Tabs。保証：Role・ARIA・キー操作・フォーカス管理・基本配色」の3層を積んだ図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">共通コンポーネントで保証した品質は、画面ごとに再検証しない</text>
<rect x="60" y="96" width="880" height="86" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/>
<text x="80" y="146" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="700" fill="#6a4ea6">システム</text>
<rect x="260" y="108" width="160" height="30" rx="15.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="340" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">業務フロー</text>
<text x="600" y="166" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">保証：支援技術を使用して業務を完遂できること</text>
<rect x="60" y="196" width="880" height="86" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="80" y="246" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">個別画面</text>
<rect x="260" y="208" width="140" height="30" rx="15.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="330" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">顧客検索</text>
<rect x="410" y="208" width="140" height="30" rx="15.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="480" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">顧客登録</text>
<rect x="560" y="208" width="140" height="30" rx="15.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="630" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">契約一覧</text>
<rect x="710" y="208" width="140" height="30" rx="15.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="780" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">契約詳細</text>
<text x="600" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">保証：文脈に応じたラベル・配置・画面遷移・エラー通知</text>
<rect x="60" y="296" width="880" height="86" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/>
<text x="80" y="338" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">デザインシステム</text><text x="80" y="360" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#2f6b45">検証済みを再利用</text>
<rect x="260" y="308" width="90" height="30" rx="15.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="305" y="328" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">Button</text>
<rect x="360" y="308" width="90" height="30" rx="15.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="405" y="328" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">Input</text>
<rect x="460" y="308" width="90" height="30" rx="15.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="505" y="328" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">Dialog</text>
<rect x="560" y="308" width="90" height="30" rx="15.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="605" y="328" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">Select</text>
<rect x="660" y="308" width="90" height="30" rx="15.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="705" y="328" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">Checkbox</text>
<rect x="760" y="308" width="90" height="30" rx="15.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="805" y="328" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">Tabs</text>
<text x="600" y="366" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">保証：Role・ARIA・キー操作・フォーカス管理・基本配色</text>
<text x="500" y="422" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">画面数が増えても、共通コンポーネントの回帰テストは増えない。組み合わせの問題だけを画面で確認する</text>
</svg>
